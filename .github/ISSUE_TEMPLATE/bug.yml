name: Bug Report

description: Report a reproducible defect in NosAiProject.

title: "[BUG] "

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions, client/device details and relevant configuration.
  - type: textarea
    id: logs
    attributes:
      label: Logs / evidence
      description: Remove secrets and credentials before posting.
