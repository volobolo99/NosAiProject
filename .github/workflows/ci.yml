name: NosAi CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python runtime
        run: python -m compileall -q nosai
      - name: Run tests
        run: python -m pytest -q

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build C# runtime
        run: dotnet build src/NosAi.Runtime/NosAi.Runtime.csproj --configuration Release
