name: NosAi CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project and test dependencies
        # Installing the project itself pulls the declared runtime dependencies
        # (e.g. cryptography); installing only pytest made collection fail.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,chain,mcp]"
      - name: Compile remaining Python packages
        # Inventory and marks: docs/INVENTARIO_PYTHON.md. COPERTO packages were
        # removed; compileall must still succeed on what is left.
        run: python -m compileall -q nosai
      - name: Verify MCP contracts and documentation links
        run: python scripts/verify_mcp_contracts.py --strict
      - name: Run remaining Python tests
        run: python -m pytest -q tests

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: src/NosAi.Runtime/NosAi.Runtime.csproj
      - name: Restore C# runtime
        run: dotnet restore src/NosAi.Runtime/NosAi.Runtime.csproj
      - name: Build C# runtime
        run: dotnet build src/NosAi.Runtime/NosAi.Runtime.csproj --configuration Release --no-restore
      - name: Run C# tests when test projects exist
        shell: bash
        # find, not a glob: ** without globstar collapses to * and would silently
        # miss a test project nested more than one directory deep, reporting
        # success. This mirrors scripts/test.sh so CI and the scripts agree.
        # No --no-restore: only NosAi.Runtime.csproj was restored above.
        #
        # NosAi.ControlPanel.Tests is skipped here: it hosts real WPF windows
        # (UseWPF, src/NosAi.ControlPanel/NosAi.ControlPanel.csproj), which needs
        # the Microsoft.WindowsDesktop.App shared runtime. That runtime has no
        # Linux build at all, so the test host cannot even launch on ubuntu-latest
        # regardless of what is installed -- this is not an environment gap to
        # close. dotnet-windows.yml already runs this project's tests on
        # windows-latest, so coverage is not lost, only moved to where it can run.
        run: |
          mapfile -t tests < <(find . -name '*Tests.csproj' -type f -not -path './.git/*' -not -name 'NosAi.ControlPanel.Tests.csproj')
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No .NET test projects found; skipping."
          else
            for test_project in "${tests[@]}"; do
              dotnet test "$test_project" --configuration Release
            done
          fi
