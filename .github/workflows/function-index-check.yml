name: Function index check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tree-sitter grammars
        run: |
          pip install "tree-sitter==0.25.2" "tree-sitter-c-sharp==0.23.5" \
            "tree-sitter-python==0.25.0" "tree-sitter-javascript==0.25.0" \
            "tree-sitter-cpp==0.23.4" "tree-sitter-bash==0.25.1" \
            "tree-sitter-powershell==0.26.4"

      - name: Regenerate function index
        run: python scripts/build_function_index.py . "${{ github.sha }}" /tmp/function-index-check --strict --write-tree

      - name: Compare against committed index
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          generated = pathlib.Path("/tmp/function-index-check")
          committed = pathlib.Path("docs/function-index")

          gen_files = {p.name for p in generated.glob("*.json")}
          com_files = {p.name for p in committed.glob("*.json")}
          if gen_files != com_files:
              print("File set mismatch:", gen_files.symmetric_difference(com_files))
              sys.exit(1)

          # source_revision is declarative (the generator does not resolve or
          # verify it, see docs/FUNCTION_INDEX.md): a commit can never declare
          # its own hash before it exists, so a manifest regenerated on HEAD
          # and then committed always has source_revision == the *parent*
          # commit. Excluded from the byte-for-byte comparison for that reason.
          mismatches = []
          for name in sorted(gen_files):
              gen_path, com_path = generated / name, committed / name
              if name == "FUNCTION_INDEX.json":
                  gen_data = json.loads(gen_path.read_text(encoding="utf-8"))
                  com_data = json.loads(com_path.read_text(encoding="utf-8"))
                  gen_data.pop("source_revision", None)
                  com_data.pop("source_revision", None)
                  if gen_data != com_data:
                      mismatches.append(name)
              elif gen_path.read_bytes() != com_path.read_bytes():
                  mismatches.append(name)

          if mismatches:
              print("docs/function-index/ e' fuori sincrono (oltre a source_revision):", mismatches)
              print("Esegui: python scripts/build_function_index.py . <SHA> docs/function-index --write-tree")
              print("e committa il risultato.")
              sys.exit(1)
          print("Function index in sync (source_revision escluso: e' dichiarativo, non verificabile contro il proprio commit).")
          PY
