[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nosai"
version = "0.1.0"
description = "NosAi clean architecture runtime"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
test = ["pytest>=8"]
mcp = ["mcp>=1.0"]

[project.scripts]
nosai-dashboard = "nosai.dashboard.server:serve"
nosai-mcp-dashboard = "nosai.mcp.dashboard:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["nosai*"]

[tool.setuptools.package-data]
# The nosai-dashboard entry point serves these from the installed package.
"nosai.dashboard" = ["static/*"]
"nosai.mcp" = ["static/*"]
