[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nosai"
version = "0.1.0"
description = "NosAi clean architecture runtime"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nosai-dashboard = "nosai.dashboard.server:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["nosai*"]
